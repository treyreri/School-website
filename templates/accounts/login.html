{% extends 'base.html' %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-header">
            <h1>Вход</h1>
            <p>Войдите в личный кабинет</p>
        </div>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="button auth-button">
                Войти
            </button>

        </form>

        <p class="auth-footer">
            Нет аккаунта?
            <a href="{% url 'accounts:register' %}">
                Зарегистрироваться
            </a>
        </p>

    </div>

</div>

{% endblock %}
