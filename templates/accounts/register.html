{% extends 'base.html' %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-header">
            <h1>Регистрация</h1>
            <p>Создайте аккаунт на сайте лицея</p>
        </div>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="button auth-button">
                Зарегистрироваться
            </button>

        </form>

        <p class="auth-footer">
            Уже есть аккаунт?
            <a href="{% url 'accounts:login' %}">
                Войти
            </a>
        </p>

    </div>

</div>

{% endblock %}
